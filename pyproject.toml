[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockstore-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Dockstore"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OICR", email = "dockstore@ga4gh.org" }]
keywords = ["dockstore", "mcp", "trs", "ga4gh", "workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastmcp>=4.0.3,<5",
    "pydantic-settings>=2.7",
    # cryptography (pulled in via fastmcp -> authlib) ships arm64-only macOS wheels
    # from 49.0.0 on. Without this pin, Intel macs fall back to the sdist and need a
    # Rust toolchain plus OpenSSL headers to build it.
    "cryptography<49; platform_system == 'Darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
dockstore-mcp = "dockstore_mcp.__main__:main"

[project.urls]
Homepage = "https://dockstore.org"
Source = "https://github.com/dockstore/mcp"
Issues = "https://github.com/dockstore/dockstore/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dockstore_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
