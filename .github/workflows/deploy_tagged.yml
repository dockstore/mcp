name: Tagged release deploy

on:
  push:
    tags:
      - '**'
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Sanitize ref name for use in a Docker tag and S3 key
        id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "sanitized=${REF_NAME//\//_}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: docker_checksum_upload_from_github
          aws-region: ${{ secrets.AWS_REGION }}

      # neat, quay itself uses manual github actions https://github.com/quay/quay/blob/master/.github/workflows/build-and-publish.yaml
      - name: Login to Quay.io
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }}
          build-args: GIT_REF=${{ steps.ref.outputs.sanitized }}

      - name: Create checksums
        run: |
          docker inspect quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }} | grep -A 1 RepoDigests
          docker inspect quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }} | grep -A 1 RepoDigests | grep -oPm1 'sha256:\K\w+' > image-digest.txt

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Copy checksum files
        run: aws s3 cp image-digest.txt  s3://${{ secrets.AWS_BUCKET }}/${{ steps.ref.outputs.sanitized }}-${{ steps.slug.outputs.sha7 }}/dockstore-mcp/image-digest.txt
