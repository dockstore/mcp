name: Tagged release and develop deploy

on:
  push:
    branches:
      - develop
    tags:
      - '**'
  workflow_dispatch:

# Only the latest push to a ref should publish its image, so an older develop build can't overwrite a newer one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Sanitize ref name for use in a Docker tag and S3 key
        id: ref
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "sanitized=${REF_NAME//\//_}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: docker_checksum_upload_from_github
          aws-region: ${{ secrets.AWS_REGION }}

      # neat, quay itself uses manual github actions https://github.com/quay/quay/blob/master/.github/workflows/build-and-publish.yaml
      - name: Login to Quay.io
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }}

      # Test the exact image about to be published, not just the one CI built
      - name: Smoke test
        run: |
          docker run --rm -d --name mcp-smoke -p 8000:8000 quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          docker rm -f mcp-smoke

      - name: Push
        run: docker push quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }}

      - name: Create checksums
        run: |
          docker inspect quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }} | grep -A 1 RepoDigests
          docker inspect quay.io/dockstore/dockstore-mcp:${{ steps.ref.outputs.sanitized }} | grep -A 1 RepoDigests | grep -oPm1 'sha256:\K\w+' > image-digest.txt

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Copy checksum files
        run: aws s3 cp image-digest.txt  s3://${{ secrets.AWS_BUCKET }}/${{ steps.ref.outputs.sanitized }}-${{ steps.slug.outputs.sha7 }}/dockstore-mcp/image-digest.txt
