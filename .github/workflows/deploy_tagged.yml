name: Tagged release deploy

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-24.04

    # Should only release tags
    # TODO: should only release tags where the required status checks are passing
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: docker_checksum_upload_from_github
          aws-region: ${{ secrets.AWS_REGION }}

      # neat, quay itself uses manual github actions https://github.com/quay/quay/blob/master/.github/workflows/build-and-publish.yaml
      - name: Login to Quay.io
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: quay.io/dockstore/dockstore-mcp:${{ github.ref_name }}

      - name: Create checksums
        run: |
          docker inspect quay.io/dockstore/dockstore-mcp:${{ github.ref_name }} | grep -A 1 RepoDigests
          docker inspect quay.io/dockstore/dockstore-mcp:${{ github.ref_name }} | grep -A 1 RepoDigests | grep -oPm1 'sha256:\K\w+' > image-digest.txt

      - name: Get short SHA
        id: slug
        run: echo "sha7=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Copy checksum files
        run: aws s3 cp image-digest.txt  s3://${{ secrets.AWS_BUCKET }}/${{ github.ref_name }}-${{ steps.slug.outputs.sha7 }}/dockstore-mcp/image-digest.txt
