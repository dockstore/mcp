name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest

  git-secrets:
    name: git-secrets scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install git-secrets
        working-directory: /tmp
        run: |
          wget --no-verbose -O git-secrets-1.3.0.tar.gz https://github.com/awslabs/git-secrets/archive/1.3.0.tar.gz
          tar -zxf git-secrets-1.3.0.tar.gz
          cd git-secrets-1.3.0
          sudo make install
      - name: Register hooks and patterns
        run: bash scripts/install-git-hooks.sh
      - name: Scan
        run: git secrets --scan

  docker:
    name: Build image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t dockstore/dockstore-mcp:ci .
      - name: Smoke test
        run: |
          docker run --rm -d --name mcp-ci -p 8000:8000 dockstore/dockstore-mcp:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          docker rm -f mcp-ci
